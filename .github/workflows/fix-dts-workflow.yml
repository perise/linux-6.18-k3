name: 修复 k3.dtsi 孤立 OPP 条目
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement
          fetch-depth: 1

      - name: 删除孤立的旧 OPP 条目
        run: |
          
          echo "$B64" | base64 -d | python3 - arch/riscv/boot/dts/spacemit/k3.dtsi

      - name: 验证并提交
        run: |
          git config user.email "perise@gmail.com"
          git config user.name "perise"
          COUNT=$(grep -c "opp-microvolt" arch/riscv/boot/dts/spacemit/k3.dtsi || true)
          echo "剩余 opp-microvolt 行数（注释内）: $COUNT"
          # 注释块内还有1个 opp-microvolt，这是正常的；孤立的5个应已删除
          [ "$COUNT" -le 1 ] || { echo "FAIL: 仍有孤立条目"; exit 1; }
          git diff --stat
          git add arch/riscv/boot/dts/spacemit/k3.dtsi
          git commit -m "riscv: dts: k3: 删除孤立的旧 GPU OPP 条目"
          git push origin enhancement
